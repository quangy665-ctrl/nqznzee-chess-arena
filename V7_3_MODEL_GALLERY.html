<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body {
    margin: 0;
    padding: 24px;
    color: #eef2ff;
    background: #080a10;
    font-family: Inter, Arial, sans-serif;
}
h1 { margin: 0 0 18px; }
.row {
    margin: 0 0 18px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    background: #151823;
}
.row h2 { margin: 0 0 10px; font-size: 16px; }
.pieces {
    display: grid;
    grid-template-columns: repeat(12, minmax(48px, 1fr));
    gap: 5px;
    align-items: end;
}
.cell {
    min-height: 88px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background:
        linear-gradient(135deg, rgba(255,255,255,.07), transparent),
        #242838;
}
.piece-image { width: 82px; height: 82px; overflow: visible; }
</style>

                <path d="M39 56 C38 64 31 70 28 76 H72 C69 70 62 64 61 56 Z"
                    fill="${fill}" stroke="${p.edge}" stroke-width="2.2"/>
                <path d="M38 40 Q50 48 62 40"
                    fill="none" stroke="${p.line}" stroke-width="1.5"/>
                ${ornament}
                ${base}
            `,
        };
        return shapes[type] || "";
    }

    function nqzCrystalShape(type, id, p) {
        const glass = `url(#${id}-glass)`;
        const core = `url(#${id}-core)`;
        const base = nqzPieceBase(id, p, "crystal");
        const facet = `stroke="${p.line}" stroke-width="1.05" fill="none" opacity=".58"`;

        const shapes = {
            p: `
                <path d="M50 14 L63 25 L58 39 L50 45 L42 39 L37 25 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="1.9"/>
                <path d="M50 14 V45 M37 25 L50 31 L63 25 M42 39 L50 31 L58 39"
                    ${facet}/>
                <path d="M43 43 L35 61 L31 76 H69 L65 61 L57 43 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2"/>
                <path d="M43 43 L50 63 L57 43 M35 61 L50 63 L65 61"
                    ${facet}/>
                ${base}
            `,
            r: `
                <path d="M27 18 L36 14 L42 23 L50 14 L58 23 L64 14 L73 18 L68 34 H32 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2"/>
                <path d="M34 34 L29 72 L50 78 L71 72 L66 34 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2"/>
                <path d="M34 34 L50 48 L66 34 M29 72 L50 48 L71 72 M50 14 V78"
                    ${facet}/>
                ${base}
            `,
            n: `
                <path d="M27 74 L34 55 L44 45 L39 35 L47 19 L64 17 L72 29 L66 39 L74 49 L61 51 L56 73 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2.1" stroke-linejoin="round"/>
                <path d="M47 19 L54 35 L64 17 M44 45 L54 35 L66 39 M34 55 L54 57 L61 51 M54 57 L56 73"
                    ${facet}/>
                <circle cx="61" cy="29" r="2.3" fill="${core}"/>
                ${base}
            `,
            b: `
                <path d="M50 11 L64 29 L57 45 L64 57 L57 73 H43 L36 57 L43 45 L36 29 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2"/>
                <path d="M50 11 V73 M36 29 L50 38 L64 29 M43 45 L50 38 L57 45 M36 57 L50 61 L64 57"
                    ${facet}/>
                <path d="M55 20 L44 40"
                    stroke="${p.glow}" stroke-width="3" stroke-linecap="round" opacity=".82"/>
                ${base}
            `,
            q: `
                <path d="M22 31 L29 16 L41 29 L50 10 L59 29 L71 16 L78 31 L68 48 H32 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2" stroke-linejoin="round"/>
                <path d="M29 16 L50 38 L71 16 M41 29 L50 38 L59 29 M22 31 L50 38 L78 31"
                    ${facet}/>
                <path d="M36 47 L40 72 L50 78 L60 72 L64 47 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2"/>
                <path d="M36 47 L50 59 L64 47 M40 72 L50 59 L60 72"
                    ${facet}/>
                ${base}
            `,
            k: `
                <path d="M46 8 H54 V18 H64 V26 H54 V36 H46 V26 H36 V18 H46 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="1.9"/>
                <path d="M31 39 L42 29 H58 L69 39 L63 52 H37 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2"/>
                <path d="M37 52 L41 72 L50 78 L59 72 L63 52 Z"
                    fill="${glass}" stroke="${p.edge}" stroke-width="2"/>
                <path d="M31 39 L50 45 L69 39 M42 29 L50 45 L58 29 M37 52 L50 61 L63 52 M41 72 L50 61 L59 72"
                    ${facet}/>
                <circle cx="50" cy="45" r="3.8" fill="${core}"/>
                ${base}
            `,
        };
        return shapes[type] || "";
    }

    function renderPieceSvg(symbol, themeId) {
        const isWhite =
            symbol === symbol.toUpperCase();

        const type =
            symbol.toLowerCase();

        const resolvedTheme =
            NQZ_ART_PALETTES[themeId]
                ? themeId
                : "standard";

        const palette =
            NQZ_ART_PALETTES[resolvedTheme][
                isWhite ? "white" : "black"
            ];

        const id =
            `nqz-art-${resolvedTheme}-${symbol}-` +
            Math.random().toString(36).slice(2);

        const sculptors = {
            standard: nqzStandardShape,
            dinosaur: nqzDinosaurShape,
            future: nqzFutureShape,
            renaissance: nqzRenaissanceShape,
            crystal: nqzCrystalShape,
        };

        const sculpture =
            sculptors[resolvedTheme](
                type,
                id,
                palette
            );

        if (!sculpture) {
            return "";
        }

        const glowOpacity =
            resolvedTheme === "future"
                ? ".62"
                : resolvedTheme === "crystal"
                ? ".38"
                : ".16";

        return `
            <svg
                class="piece-image nqz-themed-piece nqz-piece-${resolvedTheme} nqz-piece-${type}"
                viewBox="0 0 100 100"
                aria-hidden="true"
                focusable="false"
            >
                <defs>
                    <linearGradient
                        id="${id}-body"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >
                        <stop offset="0" stop-color="${palette.top}"/>
                        <stop offset=".52" stop-color="${palette.mid}"/>
                        <stop offset="1" stop-color="${palette.low}"/>
                    </linearGradient>

                    <linearGradient
                        id="${id}-glass"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >
                        <stop offset="0" stop-color="${palette.top}" stop-opacity=".95"/>
                        <stop offset=".45" stop-color="${palette.mid}" stop-opacity=".78"/>
                        <stop offset="1" stop-color="${palette.low}" stop-opacity=".92"/>
                    </linearGradient>

                    <radialGradient
                        id="${id}-core"
                        cx=".38"
                        cy=".32"
                        r=".72"
                    >
                        <stop offset="0" stop-color="#ffffff"/>
                        <stop offset=".24" stop-color="${palette.glow}"/>
                        <stop offset="1" stop-color="${palette.low}"/>
                    </radialGradient>

                    <filter
                        id="${id}-shadow"
                        x="-30%"
                        y="-30%"
                        width="160%"
                        height="170%"
                    >
                        <feDropShadow
                            dx="0"
                            dy="4.2"
                            stdDeviation="2.6"
                            flood-color="#000000"
                            flood-opacity=".46"
                        />
                    </filter>

                    <filter
                        id="${id}-glow"
                        x="-50%"
                        y="-50%"
                        width="200%"
                        height="200%"
                    >
                        <feGaussianBlur stdDeviation="2.6" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <ellipse
                    cx="50"
                    cy="91"
                    rx="28"
                    ry="4.2"
                    fill="#000000"
                    opacity=".18"
                />

                <g filter="url(#${id}-shadow)">
                    ${sculpture}
                </g>

                <path
                    d="M29 24 Q43 13 56 17"
                    fill="none"
                    stroke="${palette.top}"
                    stroke-width="2.1"
                    stroke-linecap="round"
                    opacity=".34"
                />

                <g
                    filter="url(#${id}-glow)"
                    opacity="${glowOpacity}"
                    pointer-events="none"
                >
                    <circle
                        cx="50"
                        cy="48"
                        r="2.1"
                        fill="${palette.glow}"
                    />
                </g>
            </svg>
        `;
    }


const names = {
    standard: "Tiêu chuẩn",
    dinosaur: "Khủng long",
    future: "Tương lai",
    renaissance: "Phục Hưng",
    crystal: "Pha lê"
};
const symbols = ["K","Q","R","B","N","P","k","q","r","b","n","p"];
document.getElementById("gallery").innerHTML =
    Object.keys(names).map(theme => `
        <section class="row">
            <h2>${names[theme]}</h2>
            <div class="pieces">
                ${symbols.map(symbol =>
                    `<div class="cell">${renderPieceSvg(symbol, theme)}</div>`
                ).join("")}
            </div>
        </section>
    `).join("");
</script>
</body>
</html>
